# SonarQube Cloud automatic analysis reads this file after the repository is
# imported and bound through the SonarQube Cloud GitHub App. Keep test files
# out of production-code metrics while retaining them as test inputs.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/__tests__/**
sonar.test.inclusions=src/**/__tests__/**
sonar.sourceEncoding=UTF-8
