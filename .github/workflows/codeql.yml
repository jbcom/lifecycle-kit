name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_analysis: ${{ steps.decision.outputs.skip_analysis }}
    steps:
      - id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          is_clearly_non_major_dependabot_update() {
            case "$PR_AUTHOR" in *dependabot*) ;; *) return 1 ;; esac
            local matched=false from_major to_major
            while IFS= read -r line; do
              if [[ "$line" =~ from[[:space:]]+v?([0-9]+)(\.[0-9]+){1,2}[[:space:]]+to[[:space:]]+v?([0-9]+)(\.[0-9]+){1,2} ]]; then
                matched=true
                from_major="${BASH_REMATCH[1]}"
                to_major="${BASH_REMATCH[3]}"
                [ "$from_major" = "$to_major" ] || return 1
              fi
            done <<< "$PR_TITLE"$'\n'"$PR_BODY"
            [ "$matched" = true ]
          }

          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$HEAD_REF" == release-please--* ]]; then
            echo "skip_analysis=true" >> "$GITHUB_OUTPUT"
          elif is_clearly_non_major_dependabot_update; then
            echo "skip_analysis=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_analysis=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: classify
    if: needs.classify.outputs.skip_analysis != 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
