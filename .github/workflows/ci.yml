name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_validation: ${{ steps.decision.outputs.skip_validation }}
    steps:
      - id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          is_clearly_non_major_dependabot_update() {
            case "$PR_AUTHOR" in *dependabot*) ;; *) return 1 ;; esac
            local matched=false from_major to_major
            while IFS= read -r line; do
              if [[ "$line" =~ from[[:space:]]+v?([0-9]+)(\.[0-9]+){1,2}[[:space:]]+to[[:space:]]+v?([0-9]+)(\.[0-9]+){1,2} ]]; then
                matched=true
                from_major="${BASH_REMATCH[1]}"
                to_major="${BASH_REMATCH[3]}"
                [ "$from_major" = "$to_major" ] || return 1
              fi
            done <<< "$PR_TITLE"$'\n'"$PR_BODY"
            [ "$matched" = true ]
          }

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_REPOSITORY" = "$BASE_REPOSITORY" ] && [ "$PR_AUTHOR" = "app/github-actions" ] && [[ "$HEAD_REF" == release-please--* ]]; then
            echo "skip_validation=true" >> "$GITHUB_OUTPUT"
            echo "Release Please PR: validation is intentionally skipped."
          elif is_clearly_non_major_dependabot_update; then
            echo "skip_validation=true" >> "$GITHUB_OUTPUT"
            echo "Clearly non-major Dependabot update: validation is intentionally skipped."
          else
            echo "skip_validation=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: classify
    if: needs.classify.outputs.skip_validation != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lockfile is in sync
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm verify

  compatibility:
    needs: classify
    if: needs.classify.outputs.skip_validation != 'true'
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # Stable required-check name for branch protection. Individual job names
  # (especially the compatibility matrix's Node/OS combinations) can change
  # as the matrix evolves; this aggregator keeps the protected-branch
  # contract fixed regardless.
  gate:
    name: CI / gate
    needs: [classify, verify, compatibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ needs.classify.outputs.skip_validation }}" = "true" ]; then
            echo "Validation intentionally skipped for this encapsulated pull request."
            exit 0
          fi
          if [ "${{ needs.classify.result }}" != "success" ] || [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.compatibility.result }}" != "success" ]; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi
