version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-major:
        update-types:
          - major
        patterns:
          - "*"
      npm-non-major:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    ignore:
      # docs/ generates the API reference with typedoc 0.28, which crashes on
      # the TypeScript 7 compiler API ("Cannot read properties of undefined
      # (reading 'PropertyDeclaration')"), so docs/package.json stays on
      # TypeScript 6. Drop this once typedoc supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-major:
        update-types:
          - major
        patterns:
          - "*"
      github-actions-non-major:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
