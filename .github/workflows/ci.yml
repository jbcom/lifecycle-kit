name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip-validation: ${{ steps.decision.outputs.skip-validation }}
    steps:
      - id: dependabot
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$HEAD_REF" == release-please--* ]]; then
            echo "skip-validation=true" >> "$GITHUB_OUTPUT"
            echo "Release Please PR: validation is intentionally skipped."
          elif [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "skip-validation=true" >> "$GITHUB_OUTPUT"
            echo "Dependabot non-major update ($UPDATE_TYPE): validation is intentionally skipped."
          else
            echo "skip-validation=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: classify
    if: needs.classify.outputs.skip-validation != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lockfile is in sync
        run: |
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm verify

  compatibility:
    needs: classify
    if: needs.classify.outputs.skip-validation != 'true'
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # Stable required-check name for branch protection. Individual job names
  # (especially the compatibility matrix's Node/OS combinations) can change
  # as the matrix evolves; this aggregator keeps the protected-branch
  # contract fixed regardless.
  gate:
    name: CI / gate
    needs: [classify, verify, compatibility]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ needs.classify.outputs.skip-validation }}" = "true" ]; then
            echo "Validation intentionally skipped for this encapsulated pull request."
            exit 0
          fi
          if [ "${{ needs.classify.result }}" != "success" ] || [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.compatibility.result }}" != "success" ]; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi
