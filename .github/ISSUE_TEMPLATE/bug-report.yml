name: Bug report
description: Report reproducible incorrect behavior in Lifecycle Kit.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Lifecycle Kit more reliable. For vulnerabilities, use the private process in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Lifecycle Kit version
      description: The exact package version or commit SHA.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js or bundler name and version, plus operating system.
      placeholder: Node.js 22.15.0 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - chem
        - bio-laws
        - forms
        - pigment
        - assemblage
        - packaging or documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest complete input and call that demonstrates the problem.
      render: js
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the complete error and stack trace when applicable.
    validations:
      required: true
