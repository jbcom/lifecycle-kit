name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip-review: ${{ steps.decision.outputs.skip-review }}
    steps:
      - id: dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - id: decision
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "skip-review=true" >> "$GITHUB_OUTPUT"
          elif [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "skip-review=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip-review=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report intentional skip
        if: needs.classify.outputs.skip-review == 'true'
        run: echo "Dependency review intentionally skipped for this encapsulated pull request."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.skip-review != 'true'
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: needs.classify.outputs.skip-review != 'true'
        with:
          fail-on-severity: high
